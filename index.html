<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIVI DOCS</title><style>
:root{font-family:Arial,sans-serif;color:#122a25}*{box-sizing:border-box}body{margin:0;background:#f3f7f5}header{background:#063f2a;color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center}header b{font-size:24px}main{max-width:1330px;margin:24px auto;padding:0 18px}nav{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}button,select,input,textarea{font:inherit}button{border:1px solid #c4d7d0;border-radius:8px;padding:11px 14px;background:white;cursor:pointer}button.primary,nav button.active{background:#075b38;color:white;border-color:#075b38}button:disabled{opacity:.5;cursor:not-allowed}.layout{display:grid;grid-template-columns:minmax(330px,1fr) minmax(320px,1.2fr);gap:20px}.card{background:white;border:1px solid #d7e3de;border-radius:12px;padding:24px;margin-bottom:18px;box-shadow:0 2px 12px #002a1810}h2{margin:0 0 20px}h3{margin-bottom:12px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}label{font-weight:600;font-size:13px}input,select,textarea{padding:10px;border:1px solid #ccd7d3;border-radius:7px;width:100%;background:white}textarea{min-height:65px}.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.muted{color:#64766d;font-size:13px}.line{display:grid;grid-template-columns:1fr 70px 110px 36px;gap:5px;align-items:center;margin-bottom:7px}.line button{padding:8px}.preview{overflow-x:auto;background:#e9efed;padding:18px;border-radius:10px}.paper{background:white;margin:auto;box-shadow:0 3px 16px #0002;color:#112f27}.receipt{width:400px;max-width:100%;padding:20px;font:14px/1.6 'Courier New',monospace}.receipt h2{text-align:center;font:bold 23px Arial;margin:0}.receipt .center{text-align:center}.dash{border-top:1px dashed #888;margin:13px 0}.receipt .pair{display:flex;justify-content:space-between;gap:10px}.receipt table{width:100%;border-collapse:collapse}.receipt td:last-child,.receipt th:last-child{text-align:right}.receipt .total{font:bold 21px Arial;display:flex;justify-content:space-between}.expense{min-width:640px;max-width:920px;padding:25px;font-size:14px}.exphead{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #008a41;padding-bottom:20px}.exphead h2{margin:5px 0;font-size:26px}.expense table{border-collapse:collapse;width:100%;margin-top:26px}.expense th{background:#06452d;color:white;padding:17px 8px}.expense td{border:1px solid #ddd;padding:20px 10px;vertical-align:middle}.expense .grand{display:flex;justify-content:space-between;border:1px solid #06452d;padding:18px;font-size:22px;font-weight:700}.danger{color:#a4262c}.toolbar{margin-bottom:12px}.hidden{display:none!important}.rowdoc{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;border-bottom:1px solid #eee;padding:12px 0;align-items:center}.note{background:#fff8db;padding:12px;border-radius:8px}img.logo{max-width:100px;max-height:70px;object-fit:contain}@media(max-width:850px){.layout{grid-template-columns:1fr}.rowdoc{grid-template-columns:1fr 1fr}.expense{transform-origin:top left}}@media print{header,nav,.noprint,.editor,.toolbar,.note{display:none!important}body,main{background:white;margin:0;padding:0}.layout{display:block}.preview{background:white;padding:0;overflow:visible}.card{border:0;box-shadow:none;padding:0;margin:0}.paper{box-shadow:none}.receipt{width:80mm}.expense{width:100%;max-width:none;min-width:0} @page{margin:8mm}}
</style></head><body><header><b>KIVI DOCS</b><span>Reçus & justificatifs • Données locales</span></header><main><nav id="nav"><button data-page="receipt" class="active">Nouveau reçu</button><button data-page="expense">Nouveau justificatif</button><button data-page="archives">Archives</button><button data-page="structures">Mes structures</button><button data-page="backup">Sauvegardes</button></nav><div id="app"></div></main><script>
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>new Intl.NumberFormat('fr-FR').format(+n||0),date=()=>new Date().toISOString().slice(0,10),uid=()=>crypto.randomUUID(),save=()=>localStorage.setItem('kividocs-v1',JSON.stringify(db));
let db;try{db=JSON.parse(localStorage.getItem('kividocs-v1')||'null')}catch{}db||={profiles:[],docs:[]};if(!db.profiles.length){db.profiles=[{id:uid(),name:'Ma structure',subtitle:'',address:'',logo:''}];save()}
let page='receipt',doc=null;
const profile=()=>db.profiles.find(p=>p.id===doc.profileId)||db.profiles[0];
function draft(kind){return{id:uid(),kind,status:'draft',profileId:db.profiles[0].id,date:date(),time:new Date().toTimeString().slice(0,5),number:'',client:'',cashier:'Caisse 1',table:'',payment:'Espèces',paid:0,beneficiary:'',role:'',service:'',note:'',lines:[{id:uid(),name:'',qty:1,price:0,start:'',end:''}],createdAt:new Date().toISOString()}}
const sum=()=>doc.lines.reduce((a,l)=>a+(+l.qty||0)*(+l.price||0),0);
function moneyWords(n){if(n===0)return'zéro';const u=['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'],t=['','','vingt','trente','quarante','cinquante','soixante'];function h(x){if(x<20)return u[x];if(x<70){let q=Math.floor(x/10),r=x%10;return t[q]+(r===1?' et un':r?'-'+u[r]:'')}if(x<80)return'soixante-'+(x===71?'et-onze':h(x-60));return'quatre-vingt'+(x===80?'s':'-'+h(x-80))}function k(x){if(x<100)return h(x);let a=Math.floor(x/100),b=x%100;return(a===1?'cent':u[a]+' cent'+(b?'':'s'))+(b?' '+h(b):'')}let a=[];for(let [v,s,p] of [[1e9,'milliard','milliards'],[1e6,'million','millions'],[1000,'mille','mille']]){let q=Math.floor(n/v);n%=v;if(q)a.push(v===1000?(q===1?'mille':k(q)+' mille'):k(q)+' '+(q===1?s:p))}if(n)a.push(k(n));return a.join(' ')}
const f=(label,key,type='text')=>'<div class="field"><label>'+label+'</label><input data-field="'+key+'" type="'+type+'" value="'+esc(doc[key])+'"></div>';
function lines(){return doc.lines.map((l,i)=>'<div class="line"><input aria-label="Désignation" placeholder="Désignation" data-line="'+i+'" data-key="name" value="'+esc(l.name)+'"><input aria-label="Quantité" type="number" min="1" data-line="'+i+'" data-key="qty" value="'+esc(l.qty)+'"><input aria-label="Prix unitaire" type="number" min="0" data-line="'+i+'" data-key="price" value="'+esc(l.price)+'"><button type="button" data-del="'+i+'" title="Retirer">×</button></div>'+(doc.kind==='expense'?'<div class="cols"><div class="field"><label>Du</label><input type="date" data-line="'+i+'" data-key="start" value="'+esc(l.start)+'"></div><div class="field"><label>Au</label><input type="date" data-line="'+i+'" data-key="end" value="'+esc(l.end)+'"></div></div>':'' )).join('')}
function receipt(){let p=profile(),v=sum();return '<article class="paper receipt"><h2>'+esc(p.name)+'</h2><div class="center">'+esc(p.subtitle)+'<p>'+esc(p.address)+'</p></div><div class="dash"></div><h3 class="center">REÇU DE CAISSE</h3>'+[['N° reçu',doc.number||'BROUILLON'],['Date',doc.date],['Heure',doc.time],['Table',doc.table],['Caissier',doc.cashier]].map(r=>'<div class="pair"><span>'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></div>').join('')+'<div class="dash"></div><table><thead><tr><th>Désignation</th><th>Qté</th><th>Montant</th></tr></thead><tbody>'+doc.lines.map(l=>'<tr><td>'+esc(l.name)+'</td><td>'+esc(l.qty)+'</td><td>'+fmt(l.qty*l.price)+'</td></tr>').join('')+'</tbody></table><div class="dash"></div><div class="total"><span>TOTAL</span><span>'+fmt(v)+' F CFA</span></div><i>Arrêté à la somme de : '+moneyWords(v)+' francs CFA</i><div class="dash"></div>'+[['Mode de paiement',doc.payment],['Montant reçu',fmt(doc.paid)],['Monnaie rendue',fmt(Math.max(0,doc.paid-v))]].map(r=>'<div class="pair"><span>'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></div>').join('')+'<div class="dash"></div><div class="pair"><span>Signature client</span><span>Cachet caisse</span></div>'+status()+'</article>'}
function status(){return doc.status==='draft'?'<p class="center danger">EXEMPLE • BROUILLON NON VALIDÉ</p>':doc.status==='cancelled'?'<p class="center danger">ANNULÉ</p>':''}
function expense(){let p=profile();return'<article class="paper expense"><div class="exphead"><div><small>'+esc(p.name).toUpperCase()+'</small><h2>Justificatif de dépenses</h2></div>'+(p.logo?'<img class="logo" src="'+p.logo+'" alt="Logo">':'<b>'+esc(p.name)+'</b>')+'</div><div class="cols" style="margin-top:25px"><div><b>Date :</b> '+esc(doc.date)+'</div><div><b>Nom du Bénéficiaire :</b> '+esc(doc.beneficiary)+'</div><div><b>Fonction :</b> '+esc(doc.role)+'</div></div><table><thead><tr><th>Intitulé de la dépense</th><th>Période</th><th>Nombre de jours (1)</th><th>Montant Unitaire (2)</th><th>Montant Total (1)×(2)</th></tr></thead><tbody>'+doc.lines.map(l=>'<tr><td>'+esc(l.name)+'</td><td>DU '+esc(l.start)+'<br>AU '+esc(l.end)+'</td><td>'+esc(l.qty)+'</td><td>'+fmt(l.price)+'</td><td><b>'+fmt(l.qty*l.price)+' FCFA</b></td></tr>').join('')+'</tbody></table><div class="grand"><span>Grand Total</span><span>'+fmt(sum())+' FCFA</span></div><p>'+esc(doc.note)+'</p><small>Réf. '+esc(doc.number||'BROUILLON')+'</small>'+status()+'</article>'}
function preview(){let target=$('#preview');if(target)target.innerHTML=doc.kind==='receipt'?receipt():expense()}
function editor(){if(!doc||doc.kind!==page)doc=draft(page);let readonly=doc.status!=='draft';$('#app').innerHTML='<div class="layout"><section class="card editor"><h2>'+(page==='receipt'?'Reçu de caisse':'Justificatif de dépenses')+'</h2><div class="field"><label>Structure émettrice</label><select id="prof">'+db.profiles.map(p=>'<option value="'+p.id+'" '+(p.id===doc.profileId?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select></div><div class="cols">'+f('Date','date','date')+(page==='receipt'?f('Heure','time','time')+f('Table','table')+f('Caissier','cashier'):f('Bénéficiaire','beneficiary')+f('Fonction','role')+f('Service','service'))+'</div>'+(page==='receipt'?'<div class="field"><label>Paiement</label><select id="payment">'+['Espèces','Mobile Money','Carte','Virement'].map(p=>'<option '+(p===doc.payment?'selected':'')+'>'+p+'</option>').join('')+'</select></div>'+f('Montant reçu','paid','number'):'')+'<h3>Lignes</h3><div id="lines">'+lines()+'</div><div class="actions"><button id="addline">+ Ajouter une ligne</button></div>'+(page==='expense'?'<div class="field"><label>Observations</label><textarea id="note">'+esc(doc.note)+'</textarea></div>':'')+'<h3>Total : <span id="total">'+fmt(sum())+'</span> FCFA</h3><div class="actions"><button class="primary" id="draft">Enregistrer brouillon</button><button id="validate">Valider et archiver</button></div><p class="muted">Les documents validés sont verrouillés; les documents de démonstration restent marqués EXEMPLE.</p></section><section><div class="toolbar actions noprint"><button class="primary" onclick="window.print()">Imprimer / Enregistrer PDF</button><button id="reset">Nouveau document</button></div><div class="preview" id="preview"></div></section></div>';const bind=()=>{document.querySelectorAll('[data-field]').forEach(e=>e.oninput=()=>{doc[e.dataset.field]=e.value;preview()});document.querySelectorAll('[data-line]').forEach(e=>e.oninput=()=>{let v=e.value;if(['qty','price'].includes(e.dataset.key))v=Number(v);doc.lines[+e.dataset.line][e.dataset.key]=v;$('#total').textContent=fmt(sum());preview()});document.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{if(doc.lines.length<2)return alert('Une ligne minimum');doc.lines.splice(+e.dataset.del,1);editor()})};bind();$('#prof').onchange=e=>{doc.profileId=e.target.value;preview()};if($('#payment'))$('#payment').onchange=e=>{doc.payment=e.target.value;preview()};if($('#note'))$('#note').oninput=e=>{doc.note=e.target.value;preview()};$('#addline').onclick=()=>{doc.lines.push({id:uid(),name:'',qty:1,price:0,start:'',end:''});editor()};$('#draft').onclick=()=>persist(false);$('#validate').onclick=()=>persist(true);$('#reset').onclick=()=>{doc=draft(page);editor()};for(let el of document.querySelectorAll('.editor input,.editor select,.editor textarea,.editor button:not(#reset)'))el.disabled=readonly;preview()}
function persist(validate){if(!doc.lines.every(l=>l.name.trim()&&Number.isSafeInteger(+l.qty)&&+l.qty>0&&Number.isSafeInteger(+l.price)&&+l.price>=0))return alert('Vérifiez les désignations, quantités et montants.');if(sum()>Number.MAX_SAFE_INTEGER)return alert('Montant trop élevé');if(validate&&doc.kind==='expense'&&!doc.beneficiary.trim())return alert('Bénéficiaire obligatoire');if(validate&&!confirm('Valider définitivement ce document ?'))return;if(validate){doc.status='validated';doc.number=(doc.kind==='receipt'?'REC':'JUS')+'-'+Date.now();doc.validatedAt=new Date().toISOString()}let idx=db.docs.findIndex(d=>d.id===doc.id);if(idx>=0)db.docs[idx]=structuredClone(doc);else db.docs.push(structuredClone(doc));save();alert(validate?'Document validé et archivé.':'Brouillon enregistré.');render()}
function archives(){let ds=[...db.docs].reverse();$('#app').innerHTML='<section class="card"><h2>Mes documents</h2><div class="field"><label>Rechercher</label><input id="search" placeholder="Référence, bénéficiaire, date"></div><div id="rows"></div></section>';let show=()=>{$('#rows').innerHTML=ds.filter(d=>JSON.stringify([d.number,d.date,d.beneficiary,d.client]).toLowerCase().includes($('#search').value.toLowerCase())).map(d=>'<div class="rowdoc"><span><b>'+esc(d.number||'Brouillon')+'</b><br><small>'+esc(d.date)+'</small></span><span>'+esc(d.kind==='receipt'?'Reçu':'Justificatif')+'<br><small>'+esc(d.status)+'</small></span><span>'+fmt(d.lines.reduce((a,l)=>a+l.qty*l.price,0))+' FCFA</span><span><button data-open="'+d.id+'">Ouvrir</button> '+(d.status==='validated'?'<button data-cancel="'+d.id+'">Annuler</button>':'')+'</span></div>').join('')||'<p>Aucun document.</p>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{doc=structuredClone(db.docs.find(d=>d.id===b.dataset.open));navigate(doc.kind)});document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{let v=prompt('Motif de l’annulation :');if(!v?.trim())return;let d=db.docs.find(d=>d.id===b.dataset.cancel);d.status='cancelled';d.cancelReason=v;save();show()})};$('#search').oninput=show;show()}
function structures(){$('#app').innerHTML='<section class="card"><h2>Mes structures</h2><p class="muted">Créez uniquement des documents pour des émetteurs que vous êtes autorisé à représenter.</p><div id="list"></div><h3>Ajouter une structure</h3><div class="cols"><div class="field"><label>Nom</label><input id="pname"></div><div class="field"><label>Sous-titre</label><input id="psub"></div><div class="field"><label>Adresse</label><input id="paddr"></div></div><button class="primary" id="addprof">Enregistrer</button></section>';$('#list').innerHTML=db.profiles.map(p=>'<p><b>'+esc(p.name)+'</b> — '+esc(p.address)+'</p>').join('');$('#addprof').onclick=()=>{let name=$('#pname').value.trim();if(!name)return alert('Nom obligatoire');db.profiles.push({id:uid(),name,subtitle:$('#psub').value,address:$('#paddr').value,logo:''});save();structures()}}
function download(s,name,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([s],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function backups(){$('#app').innerHTML='<section class="card"><h2>Sauvegardes</h2><p class="note">Les données sont stockées uniquement sur cet appareil. Exportez régulièrement une sauvegarde. Effacer le navigateur peut supprimer vos documents.</p><div class="actions"><button class="primary" id="export">Télécharger sauvegarde JSON</button><button id="csv">Exporter CSV</button></div><div class="field"><label>Restaurer une sauvegarde</label><input id="file" type="file" accept=".json"></div><button id="import">Importer</button></section>';$('#export').onclick=()=>download(JSON.stringify({app:'KIVI_DOCS',version:1,...db},null,2),'kivi-docs.json','application/json');$('#csv').onclick=()=>download('Référence;Type;Date;Montant;Statut\n'+db.docs.map(d=>[d.number,d.kind,d.date,d.lines.reduce((s,l)=>s+l.qty*l.price,0),d.status].join(';')).join('\n'),'archives.csv','text/csv');$('#import').onclick=async()=>{try{let file=$('#file').files[0];if(!file)return;let v=JSON.parse(await file.text());if(v.app!=='KIVI_DOCS'||!Array.isArray(v.docs)||!Array.isArray(v.profiles))throw Error('Format incorrect');if(!confirm('Ajouter les documents sauvegardés sans remplacer les existants ?'))return;for(let p of v.profiles)if(typeof p.id==='string'&&typeof p.name==='string'&&!db.profiles.some(x=>x.id===p.id))db.profiles.push(p);for(let d of v.docs)if(typeof d.id==='string'&&['receipt','expense'].includes(d.kind)&&Array.isArray(d.lines)&&!db.docs.some(x=>x.id===d.id))db.docs.push(d);save();alert('Restauration terminée')}catch(e){alert('Import refusé : '+e.message)}}}
function navigate(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}function render(){if(page==='receipt'||page==='expense')editor();else if(page==='archives')archives();else if(page==='structures')structures();else backups()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{doc=null;navigate(b.dataset.page)});render();
</script></body></html>
